<svg width="680" height="1156" viewBox="0 0 680 1156" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Document Creation Workflow — phased pipeline</title>
<desc>The Document Creation Workflow is a phased pipeline of 37 Claude Code skills, driven by the book-machine orchestrator skill: framing / always-on (book-machine, prose-style, series-bible, and an audit log that records every skill run); 1 Foundations (project-research, character-dossier, story-bible, outline-designer); 2 Draft (chapter-writer or chapter-consensus, then three passes auto-fire on each draft in order — clarity-edit, propulsion-editor, ai-ism-editor — each editing from the last so all three land in one promotable proposal); opt-in per-chapter passes (devague, and editor-ensemble which fans out five active editors — story, continuity, dialogue, momentum, voice — and merges the best of each); 3 Edit (developmental-edit, book-editor, chapter-transition, dialogue-pass); 4 Diagnostics read-only scans (style-check, deduplicator, ai-detection, whose active counterpart is ai-ism-editor); 5 Verify gates (fidelity-review, review-panel, preflight-check); 6 Publishing prep (front-matter, back-cover-blurb, amazon-book-categorizer, cover-designer to midjourney-images); 7 Package (epub, docx, pdf). chapter-consensus drafts with six lenses (interiority, pacing, dialogue, sensory, restraint, hook), N=6 by default.</desc>
<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
  .th { font-size: 21px; font-weight: 700; fill: #1a1a1a; }
  .tsub { font-size: 13px; font-weight: 400; fill: #5F5E5A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-gray rect,   rect.c-gray   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1.2; }
  .c-gray   .t { fill: #2C2C2A; } .c-gray   .ts { fill: #5F5E5A; }
  .c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1.2; }
  .c-purple .t { fill: #26215C; } .c-purple .ts { fill: #534AB7; }
  .c-teal rect,   rect.c-teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.2; }
  .c-teal   .t { fill: #04342C; } .c-teal   .ts { fill: #0F6E56; }
  .c-pink rect,   rect.c-pink   { fill: #FBEAF0; stroke: #993556; stroke-width: 1.2; }
  .c-pink   .t { fill: #4B1528; } .c-pink   .ts { fill: #993556; }
</style>
